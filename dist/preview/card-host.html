<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>卡面渲染 host</title>
  <!-- 与游戏同域部署：直接引游戏自己的文件（它们用 /static/、/fonts/ 绝对路径）。
       好处是预览永远跟着线上代码走，不需要重新生成 vendor。
       若要独立域名/桌面版部署，改回下面两行的 vendor 版本并跑
       Python联机版/tools/extract_renderer_vendor.py 生成副本：
         <base href="/vendor/" />
         <link rel="stylesheet" href="/vendor/style.css" />
         <script src="/vendor/game.js"></script> -->
  <!-- 用游戏自己的 style.css 与 game.js 渲染卡面（与 card-exporter 同一套）。
       带 ?v=<游戏提交号> 加载：游戏更新后浏览器不会复用旧的缓存副本。 -->
  <script>
    (function () {
      /* 字体先预加载：中文子集 1.16 MB，不预加载时首屏会先画系统字体 */
      ['Kreadon-Regular.subset.woff2', 'Kreadon-Demi.subset.woff2'].forEach(function (name) {
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'font';
        preload.type = 'font/woff2';
        preload.crossOrigin = 'anonymous';
        preload.href = '/fonts/' + name;
        document.head.appendChild(preload);
      });
      fetch('/api/healthz')
        .then(function (r) { return r.json(); })
        .then(function (d) { return (d && d.git_sha) || ''; })
        .catch(function () { return ''; })
        .then(function (sha) {
          var suffix = sha ? '?v=' + encodeURIComponent(sha) : '';
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/static/css/style.css' + suffix;
          document.head.appendChild(link);
          var script = document.createElement('script');
          script.src = '/static/js/game.js' + suffix;
          document.body.appendChild(script);
        });
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { display: flex; align-items: center; justify-content: center; }
    #status { position: absolute; left: 8px; top: 6px; font: 12px/1.4 sans-serif; color: #b00; }
  </style>
  <script type="module" crossorigin src="../assets/card-host-BpQqayQ2.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/card-text-rules-OWeSPTpl.js">
  <meta name="studio-version" content="v1.1.1">
  <meta name="studio-build" content="2026-09-11 09:37">
  <!-- GTN Mod Studio v1.1.1 · build 2026-09-11 09:37 -->
</head>
<body>
  <div id="stage"></div>
  <div id="status"></div>

  <script>
    /* 与 card-exporter 相同的开关：不建 socket、不跑游戏主循环 */
    window.__GTN_CARD_EXPORTER_RENDERER__ = true;
    window.__GTN_BETA_MODE__ = false;
    window.__GTN_INSTANCE_ID__ = 'mod-studio-preview';
    window.__GTN_INSTANCE_PORT__ = '';
    window.__GTN_MOD_STUDIO_HOST__ = true;
  </script>
</body>
</html>
